name: link-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # External links rot without a commit to trigger a rerun, so a dormant repo
  # would otherwise never find out.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# The reusable workflow restricts itself to this as well, but a called workflow
# can only ever narrow what the caller holds -- so the caller is where the
# ceiling is actually set.
permissions:
  contents: read

jobs:
  links:
    # The v2 tag predates the Ubuntu sudo-rs fix in r-lib/actions.
    uses: gojiplus/r-canon/.github/workflows/reusable-link-check.yml@6acf709ac1160e2327c716a1a0a386d7abdd8ceb
    with:
      # The API base URL answers 404 to an unauthenticated GET by design.
      exclude: |
        ^https://www\.virustotal\.com/api/v3$
